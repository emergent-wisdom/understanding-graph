name: Publish npm release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag to resume (for example v0.1.31)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Reject tracked project and database data
        run: |
          tracked_data="$(git ls-files | grep -E '(^|/)(projects|case-studies|demo-projects)/|(^|/)[^/]+\.(db|sqlite|sqlite3)(-.+)?$' || true)"
          if [ -n "$tracked_data" ]; then
            echo "Tracked project or database data is forbidden:"
            echo "$tracked_data"
            exit 1
          fi

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          test "$(node -p "require('./server.json').version")" = "$VERSION"
          test "$(node -p "require('./server.json').packages[0].version")" = "$VERSION"

      - name: Install, verify, and build
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test
          npm run lint
          npm audit --omit=dev
          npm run smoke:mcp
          npm run smoke:web-discovery

      - name: Publish packages in dependency order
        run: |
          RELEASE_COMMIT="$(git rev-parse HEAD)"

          publish_package() {
            local manifest="$1"
            local package_path="$2"
            local name version spec lookup_output lookup_error published_head

            name="$(node -p "require('./$manifest').name")"
            version="$(node -p "require('./$manifest').version")"
            spec="$name@$version"

            if lookup_output="$(npm view "$spec" gitHead 2>"$RUNNER_TEMP/npm-view-error")"; then
              if [ "$lookup_output" != "$RELEASE_COMMIT" ]; then
                echo "Refusing to skip $spec: registry gitHead does not match $RELEASE_COMMIT."
                echo "Registry gitHead: ${lookup_output:-<missing>}"
                exit 1
              fi
              echo "$spec is already published from this commit; continuing."
            else
              lookup_error="$(<"$RUNNER_TEMP/npm-view-error")"
              if [[ "$lookup_error" != *E404* ]]; then
                echo "$lookup_error"
                exit 1
              fi
              npm publish "$package_path" --access public
            fi

            # npm can accept a trusted publication before it becomes visible to reads.
            for attempt in {1..150}; do
              if published_head="$(npm view "$spec" gitHead 2>/dev/null)" &&
                [ "$published_head" = "$RELEASE_COMMIT" ]; then
                echo "$spec is visible from $RELEASE_COMMIT."
                return
              fi
              sleep 2
            done

            echo "$spec did not become visible with the expected gitHead."
            exit 1
          }

          publish_package packages/core/package.json ./packages/core
          publish_package packages/mcp-server/package.json ./packages/mcp-server
          publish_package packages/web-server/package.json ./packages/web-server
          publish_package package.json .

      - name: Install MCP Publisher 1.8.1
        run: |
          curl -fsSL \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/mcp-publisher.tgz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"

      - name: Publish MCP Registry record
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          if publish_output="$("$RUNNER_TEMP/mcp-publisher" publish server.json 2>&1)"; then
            echo "$publish_output"
          elif [[ "$publish_output" == *"cannot publish duplicate version"* ]]; then
            # Registry versions are immutable, so a resumed successful release is already complete.
            echo "$publish_output"
            echo "This MCP Registry version is already published; continuing."
          else
            echo "$publish_output"
            exit 1
          fi
