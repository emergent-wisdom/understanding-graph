name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reject tracked project and database data
        run: |
          tracked_data="$(git ls-files | grep -E '(^|/)(projects|case-studies|demo-projects)/|(^|/)[^/]+\.(db|sqlite|sqlite3)(-.+)?$' || true)"
          if [ -n "$tracked_data" ]; then
            echo "Tracked project or database data is forbidden:"
            echo "$tracked_data"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Smoke test packaged entry points
        run: |
          node bin/cli.js --help
          npm run smoke:mcp
          npm run smoke:web-discovery
          npm pack --dry-run --json
          npm pack --dry-run --json -w @emergent-wisdom/understanding-graph-core
          npm pack --dry-run --json -w @emergent-wisdom/understanding-graph-mcp-server
          npm pack --dry-run --json -w @emergent-wisdom/understanding-graph-web-server
