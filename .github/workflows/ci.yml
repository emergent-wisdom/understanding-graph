name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Smoke test packaged entry points
        run: |
          node bin/cli.js --help
          npm run smoke:mcp
          npm pack --dry-run --json
          npm pack --dry-run --json -w @emergent-wisdom/understanding-graph-core
          npm pack --dry-run --json -w @emergent-wisdom/understanding-graph-mcp-server
          npm pack --dry-run --json -w @emergent-wisdom/understanding-graph-web-server
